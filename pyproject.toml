[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "complejos-k"
version = "2.0.0"
description = "Detección y Localización de Complejos-K en Señales EEG mediante Redes Neuronales Convolucionales y Recurrentes (CRNN)."
readme = "README.md"
authors = [
    { name = "Fernando Palma", email = "fernando.palma.b@ug.uchile.cl" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.22.0",
    "pandas>=2.0.0",
    "scipy>=1.9.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
    "pyarrow>=10.0.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
complejos-k = "complejos_k.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["complejos_k*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v"
